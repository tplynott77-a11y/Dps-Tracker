<script>/* The DPS Throne — an offline-first, user-editable personal archive. */
(()=>{'use strict';
const STORAGE_KEY='dps-throne-v1-tests';
const origin=Array.isArray(window.DPS_SEED)?window.DPS_SEED:[];
let tests=load(),page='home',q='',champion='',sort='dps',testSort='date',verificationFilter='all',pageIndex=0,selectedA='SKI-FUR-N2D-01',selectedB='VES-AET-C6-01';
const pageSize=15;
const $=(s,root=document)=>root.querySelector(s),$$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const fmt=n=>n===null||n===undefined||n===''?'—':new Intl.NumberFormat('en-IE',{maximumFractionDigits:2}).format(Number(n));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>v===null||v===''||v===undefined?null:Number.isFinite(Number(v))?Number(v):null;
const initials=name=>String(name??'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const pastel=['#4b7cb1','#7373bd','#8b6bb3','#5d9b94','#927ba7','#8e7864','#a75c68','#597fa6','#7474b5'];
const av=name=>pastel[[...String(name)].reduce((acc,c)=>acc+c.charCodeAt(0),0)%pastel.length];
const avatar=(name,mini=false)=>`<span class="${mini?'mini-avatar':'avatar'}" style="--av:${av(name)}">${esc(initials(name))}</span>`;
const standard=t=>Math.abs(Number(t.duration)-60)<.05||t.id==='MIT-00A';
const qualified=t=>standard(t)&&n(t.dps)!==null;
const num=t=>n(t?.dps)||0;
const verifyBadge=t=>{if(t.id==='MIT-00A')return `<span class="badge warn">67.47s exception</span>`;if(!standard(t))return '<span class="badge bad">Nonstandard timing</span>';if((t.verification||'').toLowerCase().includes('screenshot'))return '<span class="badge good">Screenshot verified</span>';if((t.verification||'').toLowerCase().includes('estimated'))return '<span class="badge bad">Estimated</span>';return '<span class="badge warn">User reported</span>';};
const datefmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'}):'Date unknown';
function load(){try{let v=localStorage.getItem(STORAGE_KEY);if(v){let p=JSON.parse(v);if(Array.isArray(p)&&p.length)return p}}catch(e){}return structuredClone(origin)}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(tests));return true}catch(e){toast('Browser storage may be unavailable. Export a backup.',true);return false}}
function leaders(){let map=new Map;for(const t of tests){if(!qualified(t))continue;const cur=map.get(t.carry);if(!cur||num(t)>num(cur))map.set(t.carry,t)}return [...map.values()].sort((a,b)=>num(b)-num(a))}
function best(name){return leaders().find(t=>t.carry===name)}
function countTests(name){return tests.filter(t=>t.carry===name).length}
function topHit(name){return Math.max(0,...tests.filter(t=>t.carry===name).map(t=>n(t.highestHit)||0))}
function highestCarry(name){return Math.max(0,...tests.filter(t=>t.carry===name).map(t=>n(t.carryDamage)||0))}
function crowd(){return new Set(tests.map(t=>t.carry)).size}

function chartSvg(arr,field='dps'){const data=arr.filter(t=>n(t[field])!==null),w=680,h=190,p=30;if(!data.length)return '<p class="muted">No chart data yet.</p>';const vals=data.map(t=>n(t[field])),lo=Math.min(0,...vals)*.95,hi=Math.max(...vals)*1.12||1;const X=i=>p+(w-2*p)*(data.length===1?.5:i/(data.length-1)),Y=v=>h-p-(h-2*p)*(v-lo)/(hi-lo);const pts=data.map((t,i)=>[X(i),Y(vals[i])]);const path=pts.map((v,i)=>(i?'L':'M')+v.map(x=>x.toFixed(1)).join(' ')).join(' ');const area=path+` L ${X(data.length-1)} ${h-p} L ${X(0)} ${h-p} Z`;return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-label="Historical ${esc(field)} chart" role="img"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#dbb267" stop-opacity=".29"/><stop offset="1" stop-color="#dbb267" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line class="gridline" x1="${p}" x2="${w-p}" y1="${p+(h-2*p)*i/3}" y2="${p+(h-2*p)*i/3}"/>`).join('')}<path class="fill" d="${area}"/><path class="line" d="${path}"/>${pts.map((v,i)=>`<circle class="dot" cx="${v[0]}" cy="${v[1]}" r="${data.length>17?3:4}" ><title>${esc(data[i].id)}: ${fmt(vals[i])}</title></circle>`).join('')}</svg>`}

function duels(){let a=tests.find(x=>x.id===selectedA)||tests[0],b=tests.find(x=>x.id===selectedB)||tests[1]||tests[0];if(!a||!b)return '<div class="empty">No test records.</div>';const diff=num(b)-num(a),percent=num(a)?diff/num(a)*100:0;const warnings=[];if(a.duration!==b.duration)warnings.push(`Different durations (${fmt(a.duration)}s vs ${fmt(b.duration)}s)`);if(a.carry!==b.carry)warnings.push('Different on-field characters');if(a.team!==b.team||[a.support1,a.support2,a.support3].join('|')!==[b.support1,b.support2,b.support3].join('|'))warnings.push('Different team compositions or test types');if(a.constellation!==b.constellation)warnings.push('Different constellations');if(a.weapon!==b.weapon)warnings.push('Weapon or equipment descriptions differ');if(!a.date||!b.date)warnings.push('One or both test dates are unknown');return `${pageHead('HEAD-TO-HEAD','The Duel Lab','Two tests enter. One number wins. But only controlled comparisons tell you why.')}

function protocol(){const steps=[['01','Standard 60-second runs','Keep tests at 60.00 seconds for the official leaderboard. A specifically approved Mitya timing overrun is marked as an exception.'],['02','Record the full team','Capture the carry and three supports, constellation, levels, talents, weapon, artifacts and rotation where known.'],['03','Hold variables steady','When testing upgrades, change one thing at a time; make the team, enemy and rotation as consistent as possible.'],['04','Repeat close comparisons','Crit variance and execution change single-run results. Repeat three to five times when differences are small.'],['05','Preserve evidence','Record total team damage, team DPS, personal carry damage, highest hit and screenshot evidence when available.'],['06','Avoid false attribution','A higher team DPS score does not mean the on-field carry personally dealt all that damage. Separate correlation from cause.']];return `${pageHead('THE CODEX','How to Defend the Throne','A common protocol keeps every title defence fair and every comparison meaningful.')}
<div class="protocol-grid">${steps.map(([k,h,d])=>`<div class="protocol-card"><div class="eyebrow">RULE ${k}</div><b>${esc(h)}</b><p>${esc(d)}</p></div>`).join('')}</div><div class="section-head"><h2 class="section-title">Evidence Legend</h2></div><div class="panel"><p>${verifyBadge({verification:'Screenshot-confirmed',duration:60,id:'sample'})} Direct numbers from a provided screenshot.</p><p>${verifyBadge({verification:'User-reported',duration:60,id:'sample'})} Historical player statement without full screenshot evidence.</p><p><span class="badge bad">Nonstandard timing</span> Logged but excluded from the standard 60-second leaderboard unless specifically approved.</p><p><span class="badge warn">67.47s exception</span> MIT-00A is included by express player instruction, despite its nonstandard duration.</p></div><div class="alert"><strong>Important:</strong> This standalone version imports the spreadsheet once and stores any new edits in this browser only. Use Export to back up your changes. There is no automatic cloud sync or public server database.</div>`}

function testForm(editId){const t=tests.find(x=>x.id===editId)||{},isEdit=Boolean(editId);const labels=[['id','Test ID *','text'],['date','Test date','date'],['carry','Carry / character *','text'],['constellation','Constellation','text'],['level','Character level','number'],['team','Team / test type','text'],['dps','Team DPS *','number'],['teamDamage','Total team damage','number'],['duration','Duration in seconds *','number'],['carryDamage','Personal carry damage','number'],['highestHit','Highest hit','number'],['support1','Support 1','text'],['support2','Support 2','text'],['support3','Support 3','text'],['talents','Talents (A/E/Q)','text'],['weapon','Weapon','text'],['evidence','Evidence','text'],['verification','Verification','select']];let form=labels.map(([key,label,type])=>`<div class="field ${key==='weapon'||key==='team'?'span2':''}"><label for="f_${key}">${esc(label)}</label>${type==='select'?`<select class="select" name="${key}" id="f_${key}">${['Screenshot-confirmed','User-reported','Estimated','Needs verification'].map(v=>`<option ${v===(t[key]||'User-reported')?'selected':''}>${v}</option>`).join('')}</select>`:`<input class="input" id="f_${key}" name="${key}" ${key==='id'&&isEdit?'readonly':''} type="${type}" ${type==='number'?'step="any"':''} value="${esc(t[key]??'')}" ${['id','carry','dps','duration'].includes(key)?'required':''}/>`}</div>`).join('');$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-close="1"><form id="testForm" class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${isEdit?'Edit Combat Record':'Record a New Test'}</h2><button type="button" class="icon-btn" data-close="1">×</button></div><div class="form-grid">${form}<div class="field span3"><label for="f_notes">Conditions / observations</label><textarea class="textarea" name="notes" id="f_notes">${esc(t.notes||'')}</textarea></div></div><div class="note">Edits save locally in this browser. Back up with Export. Results with nonstandard timing are excluded from the official rankings, except approved exceptions.</div><div class="form-actions" style="margin-top:16px">${isEdit?`<button type="button" class="btn btn-danger" data-delete="${esc(editId)}">Delete</button>`:''}<button type="button" class="btn btn-secondary" data-close="1">Cancel</button><button class="btn btn-gold" type="submit">${isEdit?'Save Changes':'Record Test'}</button></div></form></div>`;$('#testForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget),vals=Object.fromEntries(fd.entries());for(const k of ['dps','duration','level','teamDamage','carryDamage','highestHit'])vals[k]=n(vals[k]);vals.id=vals.id?.trim();vals.carry=vals.carry?.trim();if(!vals.id||!vals.carry||!Number.isFinite(vals.dps)||!Number.isFinite(vals.duration)||vals.duration<=0){toast('Please enter a unique ID, character, valid DPS and duration.',true);return}if(!isEdit&&tests.some(x=>x.id===vals.id)){toast('Test ID already exists.',true);return}vals.carryShare=(vals.carryDamage!=null&&vals.teamDamage)?vals.carryDamage/vals.teamDamage:null;const pos=tests.findIndex(x=>x.id===vals.id);if(pos>=0)tests[pos]=vals;else tests.push(vals);save();$('#modalRoot').innerHTML='';toast('Test saved to this browser.');render()})}

function parseCSV(txt){const result=[],rows=[];let cur='',row=[],quote=false;txt=txt.replace(/^\uFEFF/,'');for(let i=0;i<txt.length;i++){const c=txt[i];if(quote){if(c==='"'&&txt[i+1]==='"'){cur+='"';i++}else if(c==='"')quote=false;else cur+=c}else if(c==='"')quote=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur=''}else cur+=c}if(cur||row.length){row.push(cur);rows.push(row)}const h=rows.findIndex(r=>r.some(c=>c.trim()==='Test ID'));if(h<0)throw Error('Expected a Test Log CSV with a Test ID header.');const hdr=rows[h].map(x=>x.trim().toLowerCase()),col=k=>hdr.indexOf(k.toLowerCase()),get=(r,k)=>col(k)>=0?r[col(k)]:null;for(const r of rows.slice(h+1)){const id=get(r,'Test ID'),carry=get(r,'Carry');if(!id||!carry)continue;const d=get(r,'Test date');let date=null;if(/^\d{4}-\d\d-\d\d/.test(d||''))date=d.slice(0,10);else if(d){const z=new Date(d);if(!isNaN(z))date=z.toISOString().slice(0,10)}const t={id,date,carry,constellation:get(r,'Const.'),level:n(get(r,'Level')),team:get(r,'Team / test type'),dps:n(get(r,'Team DPS')),teamDamage:n(get(r,'Total team DMG')),duration:n(get(r,'Duration (s)')),carryDamage:n(get(r,'Carry DMG')),highestHit:n(get(r,'Highest hit')),support1:get(r,'Support 1'),support2:get(r,'Support 2'),support3:get(r,'Support 3'),talents:get(r,'Talents (A/E/Q)'),weapon:get(r,'Weapon'),notes:get(r,'Conditions / observations'),evidence:get(r,'Evidence'),verification:get(r,'Verification')||'User-reported'};t.carryShare=t.teamDamage&&t.carryDamage?t.carryDamage/t.teamDamage:null;result.push(t)}return result}

  getTests:()=>structuredClone(tests),
  mergeDriveRecords(records){
    if(!Array.isArray(records)||records.length<1)throw Error('The Google Sheet had no valid Test Log rows. No data was changed.');
    const source=new Map();
    for(const record of records){
      if(!record||!record.id||!record.carry||!Number.isFinite(n(record.dps))||!Number.isFinite(n(record.duration)))continue;
      if(source.has(record.id))throw Error('Duplicate Test ID in Google Sheet: '+record.id+'. No changes applied.');
      source.set(record.id,record);
    }
    if(source.size===0)throw Error('No valid records found. Your browser archive is unchanged.');
    const old=new Map(tests.map(t=>[t.id,t]));
    const changedFields=['date','carry','constellation','level','team','dps','teamDamage','duration','carryDamage','highestHit','support1','support2','support3','talents','weapon','notes','evidence','verification'];
    const normalized=v=>v===null||v===undefined?'':String(v).trim();
    let added=0,changed=0,unchanged=0;
    for(const [id,record] of source){
      if(!old.has(id)){added++;continue}
      const prev=old.get(id);
      if(changedFields.some(k=>normalized(prev[k])!==normalized(record[k])))changed++;else unchanged++;
    }
    const localOnly=tests.filter(t=>!source.has(t.id));
    const msg=`Google Sheet: ${source.size} records.\n\n${added} new, ${changed} updated, ${unchanged} unchanged.\n${localOnly.length} browser-only records will be retained (not uploaded).\n\nApply this read-only refresh? Existing records with matching IDs will be updated from the Sheet; a local backup will be saved first.`;
    if(!confirm(msg))return {cancelled:true,added,changed,unchanged,localOnly:localOnly.length};

      if(!confirm('Your browser cannot save a pre-sync backup. Continue anyway? You should use Export first.'))return {cancelled:true};
    }
    tests=[...source.values(),...localOnly];
    save();champion='';q='';open('home');
    toast(`Google Sheet refreshed: ${added} new · ${changed} updated · ${localOnly.length} local-only retained.`);
    return {added,changed,unchanged,localOnly:localOnly.length,total:source.size};
  },
  alert(msg,isError=false){toast(msg,isError)}
};
render();
})();
